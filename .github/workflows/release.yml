name: Release

# Pushing a version tag (v3.0, v3.1, ...) builds out.lua and publishes it as a release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 build.py
      # The title is the tag's message when it has one (git tag -a v4.1 -m "OpenDex 4.1 [AI Support]"), else "OpenDex 4.1"
      - run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          TITLE="OpenDex ${GITHUB_REF_NAME#v}"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ]; then TITLE="$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")"; fi
          gh release create "$GITHUB_REF_NAME" out.lua --title "$TITLE" --generate-notes || gh release upload "$GITHUB_REF_NAME" out.lua --clobber
        env:
          GH_TOKEN: ${{ github.token }}
